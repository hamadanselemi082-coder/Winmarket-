<!DOCTYPE html>
<html lang="sw">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WIN MARKET | Admin</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff8f1;
            color: #172033;
        }

        header {
            background: #172033;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 21px;
        }

        .admin-badge {
            background: #f97316;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 30px 18px;
        }

        .top {
            margin-bottom: 25px;
        }

        .top h2 {
            margin-bottom: 6px;
        }

        .top p {
            color: #667085;
            font-size: 14px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .product {
            background: white;
            border: 1px solid #eee7df;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 5px 18px rgba(0,0,0,.05);
        }

        .product-icon {
            height: 120px;
            border-radius: 12px;
            background: #fff1e6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin-bottom: 15px;
        }

        .category {
            color: #ea580c;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .product h3 {
            margin: 7px 0;
            font-size: 17px;
        }

        .price {
            font-weight: 900;
            font-size: 16px;
            margin-bottom: 7px;
        }

        .location,
        .seller {
            color: #667085;
            font-size: 12px;
            margin: 6px 0;
        }

        .delete-btn {
            width: 100%;
            margin-top: 15px;
            border: none;
            background: #dc2626;
            color: white;
            padding: 12px;
            border-radius: 9px;
            font-weight: bold;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .loading,
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #667085;
        }

        .logout {
            border: none;
            background: white;
            color: #172033;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        @media(max-width: 800px) {

            .products {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media(max-width: 520px) {

            header {
                padding: 15px;
            }

            header h1 {
                font-size: 17px;
            }

            .products {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>WIN MARKET 👑</h1>

    <span class="admin-badge">
        ADMIN PANEL
    </span>

    <button
        class="logout"
        onclick="logoutAdmin()"
    >
        🚪 Toka
    </button>

</header>


<main>

    <div class="top">

        <h2>
            📦 Bidhaa Zilizopo
        </h2>

        <p>
            Hapa unaweza kuondoa bidhaa ambazo tayari zimeuzwa.
        </p>

    </div>


    <div
        class="products"
        id="adminProducts"
    >

        <div class="loading">
            ⏳ Inapakia bidhaa...
        </div>

    </div>

</main>


<script type="module" src="admin.js"></script>

</body>

</html>
