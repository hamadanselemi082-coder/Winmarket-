<!DOCTYPE html>
<html lang="sw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ingia | WIN MARKET</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #2563eb;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
        }

        .description {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .forgot {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        WIN <span>MARKET</span>
    </div>

    <h2>Karibu Tena</h2>

    <p class="description">
        Ingia kwenye akaunti yako ya WIN MARKET
    </p>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="mfano@gmail.com"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Password yako"
            required
        >

        <button
            type="submit"
            id="loginButton"
        >
            Ingia
        </button>

        <a
            href="#"
            id="forgotPassword"
            class="forgot"
        >
            Umesahau password?
        </a>

    </form>

    <div
        class="message"
        id="message"
    ></div>

    <div class="register">
        Huna akaunti?
        <a href="register.html">Jisajili</a>
    </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyC_4QehikPfVElfPe4j9Jr-aG1xd-E54-U",

    authDomain:
        "win-market-10eaf.firebaseapp.com",

    projectId:
        "win-market-10eaf",

    storageBucket:
        "win-market-10eaf.firebasestorage.app",

    messagingSenderId:
        "82624065101",

    appId:
        "1:82624065101:web:6b0b822141010644057604"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const form =
    document.getElementById("loginForm");

const message =
    document.getElementById("message");

const button =
    document.getElementById("loginButton");

const forgotPassword =
    document.getElementById("forgotPassword");


/* =====================================================
   LOGIN
===================================================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document
            .getElementById("email")
            .value
            .trim();

        const password =
            document
            .getElementById("password")
            .value;


        message.innerText =
            "Inaingia...";

        button.disabled =
            true;


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            message.innerText =
                "✅ Umeingia kikamilifu!";


            setTimeout(
                function() {

                    window.location.href =
                        "index.html";

                },
                1000
            );


        }

        catch(error) {

            console.error(error);


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message.innerText =
                    "❌ Email au password si sahihi.";

            }

            else {

                message.innerText =
                    "❌ " + error.message;

            }


            button.disabled =
                false;

        }

    }
);


/* =====================================================
   FORGOT PASSWORD
===================================================== */

forgotPassword.addEventListener(
    "click",
    async function(event) {

        event.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        if (!email) {

            message.innerText =
                "⚠️ Andika email yako kwanza.";

            document
                .getElementById("email")
                .focus();

            return;

        }


        message.innerText =
            "⏳ Inatuma reset link...";


        try {

            await sendPasswordResetEmail(
                auth,
                email
            );


            message.innerText =
                "✅ Reset link imetumwa kwenye email yako. Angalia Inbox na Spam.";

        }

        catch(error) {

            console.error(
                "PASSWORD RESET ERROR:",
                error
            );


            if (
                error.code ===
                "auth/invalid-email"
            ) {

                message.innerText =
                    "❌ Email uliyoandika si sahihi.";

            }

            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message.innerText =
                    "❌ Hakuna akaunti yenye email hiyo.";

            }

            else {

                message.innerText =
                    "❌ Imeshindikana kutuma reset link.";

            }

        }

    }
);

</script>

</body>
</html>
